<section class="pt-5">
  <div class="w-full">
    <form
      class="w-120 relative rounded-sm border-[#1D242E50] border-[0.2px] bg-gray-200/60 flex justify-between items-center pr-3"
    >
      <input
        type="text"
        placeholder="Search for anything here.."
        class="w-full inline-block p-3 rounded-lg placeholder:font-sans! placeholder:text-gray-400 focus:outline-none font-light font-sans"
      />
      <button
        type="submit"
        aria-label="Search"
        class="text-gray-400 hover:text-gray-600 transition-colors duration-300"
      >
        <ng-icon name="featherSearch" class="text-[1.2rem]" />
      </button>
    </form>
  </div>
</section>
