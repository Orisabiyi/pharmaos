<nav
  class="w-full px-32 py-6 bg-white border-b border-gray-400 flex items-center">
  <form class="w-120 relative">
    <input
      type="text"
      placeholder="Search for anything here.."
      class="bg-gray-200/60 w-full inline-block p-3 rounded-lg placeholder:!font-sans placeholder:text-gray-400 focus:outline-none font-light font-sans" />
  </form>

  <div class="ml-auto font-sans font-light text-right">
    <h3 class="font-normal">Good Morning</h3>

    <div class="flex gap-4 items-center">
      <p>{{ dateValue | date: 'dd MMMM yyyy' }}</p>
      <p>{{ dateValue | date: 'HH:mm:ss' }}</p>
    </div>
  </div>
</nav>
